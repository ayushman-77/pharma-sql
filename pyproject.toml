[project]
name = "pharmasql"
version = "0.1.0"
description = "Autonomous text-to-SQL agent for pharma commercial analytics, running on local open-source LLMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langchain-chroma>=0.2",
    "chromadb>=1.0",
    "sqlglot>=26.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "faker>=25.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.38",
    "matplotlib>=3.8",
]

[project.scripts]
pharmasql = "pharmasql.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmasql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: requires a running Ollama server with the configured models"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Product/payer reference tables read best one record per line.
"src/pharmasql/data/generate.py" = ["E501"]
