# Pharma text-to-SQL benchmark: 80 questions with hand-verified gold SQL.
#   easy (20)          single table or one join, simple filters
#   medium (25)        multi-join, GROUP BY, relative time, ranking
#   hard (20)          market share, growth, quota attainment, window functions, anti-joins
#   unanswerable (15)  the data mart cannot answer; the correct behaviour is to abstain
#
# Gold queries return the minimal columns that answer the question. A prediction may return
# extra columns. `alt_sql` lists equally valid gold results where formatting is legitimately
# ambiguous (e.g. one full-name column vs first/last name).
# Questions are disjoint from the few-shot bank (config/verified_queries.yaml).

# ------------------------------------------------------------------------------- easy
- id: E01
  difficulty: easy
  question: How many HCPs are in the database?
  sql: SELECT COUNT(*) FROM dim_hcp;
- id: E02
  difficulty: easy
  question: How many sales territories are there in the West region?
  sql: |
    SELECT COUNT(*) FROM dim_territory t JOIN dim_region g ON g.region_id = t.region_id
    WHERE g.region_name = 'West';
- id: E03
  difficulty: easy
  question: List our own brands and their therapeutic areas.
  sql: SELECT brand_name, therapeutic_area FROM dim_product WHERE is_own_brand = 1;
- id: E04
  difficulty: easy
  question: What is the WAC price of Oncorex?
  sql: SELECT wac_price FROM dim_product WHERE brand_name = 'Oncorex';
- id: E05
  difficulty: easy
  question: How many oncologists do we have in our HCP universe?
  sql: SELECT COUNT(*) FROM dim_hcp WHERE specialty = 'Oncology';
- id: E06
  difficulty: easy
  question: What was total TRx for Glucovia in 2025?
  sql: |
    SELECT SUM(r.trx) FROM fact_rx r JOIN dim_product p ON p.product_id = r.product_id
    WHERE p.brand_name = 'Glucovia' AND r.month BETWEEN '2025-01-01' AND '2025-12-01';
- id: E07
  difficulty: easy
  question: What were total net sales across all our brands last quarter?
  sql: |
    SELECT SUM(s.net_sales) FROM fact_sales s JOIN dim_calendar c ON c.month = s.month
    WHERE c.year_quarter = '2026-Q3';
- id: E08
  difficulty: easy
  question: How many calls did reps make in September 2026?
  sql: SELECT COUNT(*) FROM fact_call WHERE call_date BETWEEN '2026-09-01' AND '2026-09-30';
- id: E09
  difficulty: easy
  question: Which payers are in the Medicare channel?
  sql: SELECT payer_name FROM dim_payer WHERE channel = 'Medicare';
- id: E10
  difficulty: easy
  question: When did Oncorex launch?
  sql: SELECT launch_date FROM dim_product WHERE brand_name = 'Oncorex';
- id: E11
  difficulty: easy
  question: How many reps are on the Specialty team?
  sql: SELECT COUNT(*) FROM dim_rep WHERE sales_team = 'Specialty';
- id: E12
  difficulty: easy
  question: What were gross sales of Pulmova in 2024?
