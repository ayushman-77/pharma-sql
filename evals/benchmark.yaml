    WHERE p.brand_name = 'Pulmova' AND s.month BETWEEN '2024-01-01' AND '2024-12-01';
- id: E13
  difficulty: easy
  question: How many HCPs are in decile 10?
  sql: SELECT COUNT(*) FROM dim_hcp WHERE decile = 10;
- id: E14
  difficulty: easy
  question: List the territories in the Midwest region.
