- id: M10
  difficulty: medium
  question: What is the call frequency per reached HCP for Neurolin this year?
  sql: |
    SELECT 1.0 * COUNT(*) / COUNT(DISTINCT fc.hcp_id) FROM fact_call fc
    JOIN dim_product p ON p.product_id = fc.product_id
    WHERE p.brand_name = 'Neurolin' AND fc.call_date BETWEEN '2026-01-01' AND '2026-09-30';
- id: M11
  difficulty: medium
  question: Which rep made the most calls in 2025?
