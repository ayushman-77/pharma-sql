- id: H16
  difficulty: hard
  question: >-
    Which brand gained the most market share (in percentage points, within its therapeutic area)
    between 2025-Q3 and 2026-Q3?
  sql: |
    WITH br AS (
      SELECT c.year_quarter, p.brand_name, p.therapeutic_area, SUM(r.trx) AS trx FROM fact_rx r
      JOIN dim_product p ON p.product_id = r.product_id
      JOIN dim_calendar c ON c.month = r.month
      WHERE c.year_quarter IN ('2025-Q3', '2026-Q3')
      GROUP BY c.year_quarter, p.brand_name, p.therapeutic_area),
    sh AS (
      SELECT br.brand_name, br.year_quarter,
             100.0 * br.trx / SUM(br.trx) OVER (PARTITION BY br.year_quarter, br.therapeutic_area)
               AS share
      FROM br)
    SELECT cur.brand_name FROM sh cur
    JOIN sh prev ON prev.brand_name = cur.brand_name AND prev.year_quarter = '2025-Q3'
    WHERE cur.year_quarter = '2026-Q3'
    ORDER BY cur.share - prev.share DESC LIMIT 1;
- id: H17
  difficulty: hard
  question: For each region, which of our brands had the highest net sales last quarter?
  sql: |
    WITH x AS (
      SELECT g.region_name, p.brand_name,
             RANK() OVER (PARTITION BY g.region_name ORDER BY SUM(s.net_sales) DESC) AS rk
      FROM fact_sales s
      JOIN dim_product p ON p.product_id = s.product_id
      JOIN dim_territory t ON t.territory_id = s.territory_id
      JOIN dim_region g ON g.region_id = t.region_id
      JOIN dim_calendar c ON c.month = s.month
      WHERE c.year_quarter = '2026-Q3'
      GROUP BY g.region_name, p.brand_name)
    SELECT region_name, brand_name FROM x WHERE rk = 1;
- id: H18
  difficulty: hard
  question: What was the month-over-month dollar change in total net sales for each month from April to September 2026?
  sql: |
    WITH m AS (SELECT month, SUM(net_sales) AS ns FROM fact_sales GROUP BY month),
    d AS (SELECT month, ns - LAG(ns) OVER (ORDER BY month) AS mom FROM m)
    SELECT mom FROM d WHERE month BETWEEN '2026-04-01' AND '2026-09-01';
- id: H19
  difficulty: hard
  question: >-
    What percentage of targeted cardiologists in deciles 8-10 received at least three Cardiozen
    calls last quarter?
  sql: |
    WITH c AS (
      SELECT fc.hcp_id FROM fact_call fc
      JOIN dim_hcp h ON h.hcp_id = fc.hcp_id
      JOIN dim_product p ON p.product_id = fc.product_id
      WHERE h.specialty = 'Cardiology' AND h.decile >= 8 AND h.is_target = 1
        AND p.brand_name = 'Cardiozen' AND fc.call_date BETWEEN '2026-07-01' AND '2026-09-30'
      GROUP BY fc.hcp_id HAVING COUNT(*) >= 3)
    SELECT 100.0 * (SELECT COUNT(*) FROM c) / COUNT(*) FROM dim_hcp
    WHERE specialty = 'Cardiology' AND decile >= 8 AND is_target = 1;
- id: H20
  difficulty: hard
  question: In how many territories did Cardiozen out-prescribe Thrombex (by TRx) last quarter?
  sql: |
    WITH x AS (
      SELECT h.territory_id,
             SUM(CASE WHEN p.brand_name = 'Cardiozen' THEN r.trx ELSE 0 END) AS cz,
             SUM(CASE WHEN p.brand_name = 'Thrombex' THEN r.trx ELSE 0 END) AS tb
      FROM fact_rx r
      JOIN dim_product p ON p.product_id = r.product_id
      JOIN dim_hcp h ON h.hcp_id = r.hcp_id
      JOIN dim_calendar c ON c.month = r.month
      WHERE c.year_quarter = '2026-Q3' AND p.brand_name IN ('Cardiozen', 'Thrombex')
      GROUP BY h.territory_id)
    SELECT COUNT(*) FROM x WHERE cz > tb;

