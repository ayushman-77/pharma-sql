- id: E20
  difficulty: easy
  question: What is the Glucovia quota for the Atlanta territory in 2026-Q4?
  sql: |
    SELECT q.target_net_sales FROM fact_quota q
    JOIN dim_product p ON p.product_id = q.product_id
    JOIN dim_territory t ON t.territory_id = q.territory_id
    WHERE p.brand_name = 'Glucovia' AND t.territory_name = 'Atlanta' AND q.year_quarter = '2026-Q4';

# ----------------------------------------------------------------------------- medium
- id: M01
  difficulty: medium
  question: What were Glucovia net sales by region last quarter?
  sql: |
    SELECT g.region_name, SUM(s.net_sales) FROM fact_sales s
    JOIN dim_product p ON p.product_id = s.product_id
    JOIN dim_territory t ON t.territory_id = s.territory_id
    JOIN dim_region g ON g.region_id = t.region_id
    JOIN dim_calendar c ON c.month = s.month
    WHERE p.brand_name = 'Glucovia' AND c.year_quarter = '2026-Q3'
    GROUP BY g.region_name;
- id: M02
  difficulty: medium
  question: Show monthly Cardiozen TRx for 2026 so far.
  sql: |
    SELECT r.month, SUM(r.trx) FROM fact_rx r JOIN dim_product p ON p.product_id = r.product_id
    WHERE p.brand_name = 'Cardiozen' AND r.month BETWEEN '2026-01-01' AND '2026-09-01'
    GROUP BY r.month;
- id: M03
  difficulty: medium
  question: What were the top 5 territories by Pulmova TRx in 2025?
  sql: |
    SELECT t.territory_name FROM fact_rx r
    JOIN dim_product p ON p.product_id = r.product_id
    JOIN dim_hcp h ON h.hcp_id = r.hcp_id
    JOIN dim_territory t ON t.territory_id = h.territory_id
    WHERE p.brand_name = 'Pulmova' AND r.month BETWEEN '2025-01-01' AND '2025-12-01'
    GROUP BY t.territory_name ORDER BY SUM(r.trx) DESC LIMIT 5;
- id: M04
  difficulty: medium
  question: What were net sales by brand in 2025, highest first?
  sql: |
    SELECT p.brand_name, SUM(s.net_sales) AS ns FROM fact_sales s
    JOIN dim_product p ON p.product_id = s.product_id
    WHERE s.month BETWEEN '2025-01-01' AND '2025-12-01'
    GROUP BY p.brand_name ORDER BY ns DESC;
- id: M05
  difficulty: medium
  question: How many calls did each sales team make last quarter?
  sql: |
    SELECT rp.sales_team, COUNT(*) FROM fact_call fc JOIN dim_rep rp ON rp.rep_id = fc.rep_id
    WHERE fc.call_date BETWEEN '2026-07-01' AND '2026-09-30'
    GROUP BY rp.sales_team;
- id: M06
  difficulty: medium
  question: How many HCPs are there in each specialty?
  sql: SELECT specialty, COUNT(*) FROM dim_hcp GROUP BY specialty;
- id: M07
  difficulty: medium
  question: What percentage of Cardiozen TRx came from each payer channel in 2026-Q3?
  sql: |
    SELECT py.channel, 100.0 * SUM(r.trx) / SUM(SUM(r.trx)) OVER () FROM fact_rx r
    JOIN dim_product p ON p.product_id = r.product_id
    JOIN dim_payer py ON py.payer_id = r.payer_id
    JOIN dim_calendar c ON c.month = r.month
    WHERE p.brand_name = 'Cardiozen' AND c.year_quarter = '2026-Q3'
    GROUP BY py.channel;
- id: M08
  difficulty: medium
  question: Which payers list Glucovia as non-preferred or do not cover it?
  sql: |
    SELECT py.payer_name FROM formulary f
    JOIN dim_payer py ON py.payer_id = f.payer_id
    JOIN dim_product p ON p.product_id = f.product_id
    WHERE p.brand_name = 'Glucovia' AND f.coverage_status IN ('Non-Preferred', 'Not Covered');
- id: M09
  difficulty: medium
  question: What was total TRx by therapeutic area in 2025?
  sql: |
