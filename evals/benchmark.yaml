# ------------------------------------------------------------------------------- hard
- id: H01
  difficulty: hard
  question: What was Glucovia's market share of diabetes TRx last quarter?
  sql: |
    SELECT 100.0 * SUM(CASE WHEN p.brand_name = 'Glucovia' THEN r.trx ELSE 0 END) / SUM(r.trx)
    FROM fact_rx r
    JOIN dim_product p ON p.product_id = r.product_id
    JOIN dim_calendar c ON c.month = r.month
    WHERE p.therapeutic_area = 'Diabetes' AND c.year_quarter = '2026-Q3';
- id: H02
  difficulty: hard
  question: What was Glucovia's share of the diabetes market in each region in 2026-Q3?
  sql: |
    SELECT g.region_name,
           100.0 * SUM(CASE WHEN p.brand_name = 'Glucovia' THEN r.trx ELSE 0 END) / SUM(r.trx)
    FROM fact_rx r
    JOIN dim_product p ON p.product_id = r.product_id
    JOIN dim_hcp h ON h.hcp_id = r.hcp_id
    JOIN dim_territory t ON t.territory_id = h.territory_id
    JOIN dim_region g ON g.region_id = t.region_id
    JOIN dim_calendar c ON c.month = r.month
    WHERE p.therapeutic_area = 'Diabetes' AND c.year_quarter = '2026-Q3'
    GROUP BY g.region_name;
- id: H03
  difficulty: hard
  question: What was the quarter-over-quarter growth in Glucovia net sales last quarter?
  sql: |
    WITH q AS (
      SELECT c.year_quarter, SUM(s.net_sales) AS ns FROM fact_sales s
      JOIN dim_product p ON p.product_id = s.product_id
      JOIN dim_calendar c ON c.month = s.month
      WHERE p.brand_name = 'Glucovia' AND c.year_quarter IN ('2026-Q2', '2026-Q3')
      GROUP BY c.year_quarter)
    SELECT 100.0 * (cur.ns - prev.ns) / prev.ns FROM q cur
    JOIN q prev ON cur.year_quarter = '2026-Q3' AND prev.year_quarter = '2026-Q2';
- id: H04
  difficulty: hard
  question: What was the year-over-year growth in Cardiozen TRx by region for 2026-Q3 versus 2025-Q3?
  sql: |
    SELECT g.region_name,
           100.0 * (SUM(CASE WHEN c.year_quarter = '2026-Q3' THEN r.trx ELSE 0 END)
                  - SUM(CASE WHEN c.year_quarter = '2025-Q3' THEN r.trx ELSE 0 END))
                 / SUM(CASE WHEN c.year_quarter = '2025-Q3' THEN r.trx ELSE 0 END)
    FROM fact_rx r
    JOIN dim_product p ON p.product_id = r.product_id
    JOIN dim_hcp h ON h.hcp_id = r.hcp_id
    JOIN dim_territory t ON t.territory_id = h.territory_id
    JOIN dim_region g ON g.region_id = t.region_id
    JOIN dim_calendar c ON c.month = r.month
    WHERE p.brand_name = 'Cardiozen' AND c.year_quarter IN ('2025-Q3', '2026-Q3')
    GROUP BY g.region_name;
- id: H05
  difficulty: hard
  question: Which 5 territories had the lowest Glucovia quota attainment in 2026-Q3?
  sql: |
    WITH a AS (
      SELECT s.territory_id, SUM(s.net_sales) AS ns FROM fact_sales s
      JOIN dim_product p ON p.product_id = s.product_id
      JOIN dim_calendar c ON c.month = s.month
      WHERE p.brand_name = 'Glucovia' AND c.year_quarter = '2026-Q3'
      GROUP BY s.territory_id)
    SELECT t.territory_name FROM fact_quota q
    JOIN dim_product p ON p.product_id = q.product_id
    JOIN a ON a.territory_id = q.territory_id
    JOIN dim_territory t ON t.territory_id = q.territory_id
    WHERE p.brand_name = 'Glucovia' AND q.year_quarter = '2026-Q3'
    ORDER BY a.ns / q.target_net_sales ASC LIMIT 5;
- id: H06
  difficulty: hard
  question: Which territories achieved at least 100% of their Cardiozen quota in 2026-Q2?
  sql: |
    WITH a AS (
      SELECT s.territory_id, SUM(s.net_sales) AS ns FROM fact_sales s
      JOIN dim_product p ON p.product_id = s.product_id
      JOIN dim_calendar c ON c.month = s.month
      WHERE p.brand_name = 'Cardiozen' AND c.year_quarter = '2026-Q2'
      GROUP BY s.territory_id)
    SELECT t.territory_name FROM fact_quota q
    JOIN dim_product p ON p.product_id = q.product_id
    JOIN a ON a.territory_id = q.territory_id
    JOIN dim_territory t ON t.territory_id = q.territory_id
    WHERE p.brand_name = 'Cardiozen' AND q.year_quarter = '2026-Q2'
      AND a.ns >= q.target_net_sales;
- id: H07
  difficulty: hard
  question: What was quota attainment for each of our brands in the first half of 2026?
  sql: |
    WITH a AS (
      SELECT s.product_id, SUM(s.net_sales) AS ns FROM fact_sales s
      WHERE s.month BETWEEN '2026-01-01' AND '2026-06-01' GROUP BY s.product_id),
    t AS (
      SELECT q.product_id, SUM(q.target_net_sales) AS tgt FROM fact_quota q
      WHERE q.year_quarter IN ('2026-Q1', '2026-Q2') GROUP BY q.product_id)
    SELECT p.brand_name, 100.0 * a.ns / t.tgt FROM a
    JOIN t ON t.product_id = a.product_id
    JOIN dim_product p ON p.product_id = a.product_id;
- id: H08
  difficulty: hard
  question: What is our combined market share in each therapeutic area year to date?
  sql: |
    SELECT p.therapeutic_area,
           100.0 * SUM(CASE WHEN p.is_own_brand = 1 THEN r.trx ELSE 0 END) / SUM(r.trx)
    FROM fact_rx r JOIN dim_product p ON p.product_id = r.product_id
    WHERE r.month BETWEEN '2026-01-01' AND '2026-09-01'
    GROUP BY p.therapeutic_area;
- id: H09
  difficulty: hard
  question: Who were the top 10 Glucovia prescribers last quarter among HCPs not on the call plan? Give their NPI and TRx.
  sql: |
    SELECT h.npi, SUM(r.trx) AS trx FROM fact_rx r
    JOIN dim_product p ON p.product_id = r.product_id
    JOIN dim_hcp h ON h.hcp_id = r.hcp_id
    JOIN dim_calendar c ON c.month = r.month
    WHERE p.brand_name = 'Glucovia' AND c.year_quarter = '2026-Q3' AND h.is_target = 0
    GROUP BY h.npi ORDER BY trx DESC LIMIT 10;
- id: H10
  difficulty: hard
  question: Show monthly Oncorex TRx since launch with a running cumulative total.
  sql: |
    SELECT r.month, SUM(r.trx), SUM(SUM(r.trx)) OVER (ORDER BY r.month) FROM fact_rx r
    JOIN dim_product p ON p.product_id = r.product_id
    WHERE p.brand_name = 'Oncorex'
    GROUP BY r.month;
- id: H11
  difficulty: hard
  question: Rank regions by Neurolin TRx growth from 2024 to 2025.
  sql: |
    SELECT g.region_name,
           100.0 * (SUM(CASE WHEN r.month LIKE '2025-%' THEN r.trx ELSE 0 END)
                  - SUM(CASE WHEN r.month LIKE '2024-%' THEN r.trx ELSE 0 END))
                 / SUM(CASE WHEN r.month LIKE '2024-%' THEN r.trx ELSE 0 END) AS growth
    FROM fact_rx r
    JOIN dim_product p ON p.product_id = r.product_id
    JOIN dim_hcp h ON h.hcp_id = r.hcp_id
    JOIN dim_territory t ON t.territory_id = h.territory_id
    JOIN dim_region g ON g.region_id = t.region_id
    WHERE p.brand_name = 'Neurolin' AND r.month BETWEEN '2024-01-01' AND '2025-12-01'
    GROUP BY g.region_name ORDER BY growth DESC;
- id: H12
  difficulty: hard
  question: >-
    Last quarter, what was the average Glucovia TRx per prescribing HCP for HCPs who received at
    least one Glucovia call versus those who received none?
  sql: |
    WITH called AS (
      SELECT DISTINCT fc.hcp_id FROM fact_call fc
      JOIN dim_product p ON p.product_id = fc.product_id
      WHERE p.brand_name = 'Glucovia' AND fc.call_date BETWEEN '2026-07-01' AND '2026-09-30'),
    rx AS (
      SELECT r.hcp_id, SUM(r.trx) AS trx FROM fact_rx r
      JOIN dim_product p ON p.product_id = r.product_id
      JOIN dim_calendar c ON c.month = r.month
      WHERE p.brand_name = 'Glucovia' AND c.year_quarter = '2026-Q3'
      GROUP BY r.hcp_id)
    SELECT AVG(rx.trx) FROM rx LEFT JOIN called ON called.hcp_id = rx.hcp_id
    GROUP BY called.hcp_id IS NOT NULL;
- id: H13
  difficulty: hard
  question: In which payer channel does Pulmova have its highest share of respiratory TRx this year?
  sql: |
    SELECT py.channel FROM fact_rx r
    JOIN dim_product p ON p.product_id = r.product_id
    JOIN dim_payer py ON py.payer_id = r.payer_id
    WHERE p.therapeutic_area = 'Respiratory' AND r.month BETWEEN '2026-01-01' AND '2026-09-01'
    GROUP BY py.channel
    ORDER BY 1.0 * SUM(CASE WHEN p.brand_name = 'Pulmova' THEN r.trx ELSE 0 END) / SUM(r.trx) DESC
    LIMIT 1;
- id: H14
  difficulty: hard
  question: What percentage of Glucovia TRx last quarter came from plans that require prior authorization for Glucovia?
  sql: |
    SELECT 100.0 * SUM(CASE WHEN f.prior_auth = 1 THEN r.trx ELSE 0 END) / SUM(r.trx)
    FROM fact_rx r
    JOIN dim_product p ON p.product_id = r.product_id
    JOIN dim_calendar c ON c.month = r.month
    LEFT JOIN formulary f ON f.payer_id = r.payer_id AND f.product_id = r.product_id
    WHERE p.brand_name = 'Glucovia' AND c.year_quarter = '2026-Q3';
