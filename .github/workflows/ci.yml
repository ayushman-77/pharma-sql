name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run ruff check src tests app
      # Offline suite: scripted LLM, generated database. No GPU or Ollama needed.
      - run: uv run pytest
